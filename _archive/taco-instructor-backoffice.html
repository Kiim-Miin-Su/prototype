<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TACO ERP — 강사 백오피스</title>
<style>
:root{
  --canvas:#f6f7f9; --raised:#fff; --subtle:#eef1f4; --inset:#f8fafc;
  --fg:#101828; --fg-muted:#475467; --fg-subtle:#667085; --fg-on:#fff;
  --border:#d1d8e0; --border-muted:#e4e8ee;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-subtle:#eff4ff;
  --red:#dc2626; --red-subtle:#fef2f2; --red-line:#fecaca;
  --green:#15803d; --green-deep:#166534; --green-subtle:#f0fdf4; --green-line:#bbf7d0;
  --amber:#b45309; --amber-subtle:#fffbeb; --amber-line:#fde68a;
  --navy:#0f172a; --navy-2:#1e293b;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --hour:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  background:var(--canvas);color:var(--fg);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;height:100vh;overflow:hidden}
/* sidebar */
.side{width:212px;flex:0 0 212px;background:var(--raised);border-right:1px solid var(--border-muted);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:16px 14px 14px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.brand .t1{font-size:13px;font-weight:800;color:var(--accent);line-height:1.2}
.brand .t2{font-size:11px;color:var(--fg-subtle)}
.nav{flex:1;padding:4px 8px;overflow:auto}
.nav button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-md);font-size:12.5px;color:var(--fg-muted);margin-bottom:2px}
.nav button .ic{width:16px;text-align:center;opacity:.85}
.nav button:hover{background:var(--subtle)}
.nav button.on{background:var(--accent-subtle);color:var(--accent);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;min-width:18px;height:18px;
  display:grid;place-items:center;font-size:10px;font-weight:800;padding:0 5px}
.me{border-top:1px solid var(--border-muted);padding:11px 13px;display:flex;align-items:center;gap:9px}
.me .av{width:28px;height:28px;border-radius:8px;background:var(--accent-subtle);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800}
.me .n{font-size:12px;font-weight:700}
.me .r{font-size:10.5px;color:var(--fg-subtle)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--raised);border-bottom:1px solid var(--border-muted)}
.top .back{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);display:grid;place-items:center;color:var(--fg-muted)}
.top .back:disabled{opacity:.35;cursor:not-allowed}
.top .home{padding:4px 11px;border-radius:7px;border:1px solid var(--border);font-size:12px;font-weight:700}
.crumb{font-size:12.5px;font-weight:700;color:var(--fg)}
.crumb .sep{color:var(--fg-subtle);font-weight:400;margin:0 5px}
.crumb .dim{color:var(--fg-muted);font-weight:500}
.sp{flex:1}
.ghost{padding:4px 10px;border:1px dashed var(--border);border-radius:7px;font-size:11px;color:var(--fg-muted)}
.who{font-size:12px;font-weight:700}
.who span{color:var(--fg-subtle);font-weight:500}
.logout{padding:4px 11px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-weight:700}
.bell{position:relative;width:28px;height:28px;display:grid;place-items:center;font-size:15px}
.bell b{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border-radius:999px;
  min-width:15px;height:15px;font-size:9px;display:grid;place-items:center;font-weight:800}
.body{flex:1;overflow:auto;padding:14px 16px 26px}
/* generic */
.card{background:var(--raised);border:1px solid var(--border-muted);border-radius:var(--r-lg)}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:8px}
.h2{font-size:15px;font-weight:800}
.h3{font-size:13px;font-weight:800}
.muted{color:var(--fg-muted)}
.subtle{color:var(--fg-subtle)}
.mini{font-size:11px}
.mono{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--raised);color:var(--fg);font-size:12px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--subtle)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-hover)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 9px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;border:1px solid transparent}
.chip.red{background:var(--red-subtle);color:var(--red);border-color:var(--red-line)}
.chip.amber{background:var(--amber-subtle);color:var(--amber);border-color:var(--amber-line)}
.chip.green{background:var(--green-subtle);color:var(--green);border-color:var(--green-line)}
.chip.blue{background:var(--accent-subtle);color:var(--accent);border-color:#c7d7fe}
.chip.gray{background:var(--subtle);color:var(--fg-muted);border-color:var(--border)}
.note{font-size:11px;color:var(--fg-subtle)}
.hint{font-size:11.5px;color:#cbd5e1;background:var(--navy);border-radius:var(--r-md);padding:10px 12px}
.hint b{color:#fff;display:block;margin-bottom:2px;font-size:12px}
.warnbox{background:var(--amber-subtle);border:1px solid var(--amber-line);border-radius:var(--r-md);padding:11px 12px;font-size:12px}
.warnbox b{color:var(--amber)}
.errbox{background:var(--red-subtle);border:1.5px solid var(--red-line);border-radius:var(--r-md);padding:11px 12px;font-size:12px}
.errbox b{color:var(--red);display:block;margin-bottom:3px}
.okbox{background:var(--green-subtle);border:1px solid var(--green-line);border-radius:var(--r-md);padding:11px 12px;font-size:12px}
.okbox b{color:var(--green)}
/* banner */
.alertbar{display:flex;align-items:center;gap:10px;background:var(--red-subtle);border:1px solid var(--red-line);
  border-radius:var(--r-lg);padding:11px 14px;margin-bottom:12px}
.alertbar .ic{width:22px;height:22px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.alertbar b{font-size:13px}
/* home */
.datecard{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:14px 18px;display:flex;align-items:center;gap:16px}
.datecard .dd{font-size:30px;font-weight:800;line-height:1}
.datecard .dw{font-size:11px;color:#94a3b8;text-align:center;margin-top:2px}
.datecard .t1{font-size:13px;font-weight:700}
.datecard .t2{font-size:11px;color:#94a3b8;margin-top:1px}
.datecard .clock{font-size:22px;font-weight:800;text-align:right;line-height:1}
.datecard .kst{font-size:10.5px;color:#94a3b8;text-align:right}
.todo-list .it{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--border-muted);cursor:pointer}
.todo-list .it:hover{background:var(--accent-subtle)}
.todo-list .it:last-child{border-bottom:0}
.todo-list .n{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800}
.todo-list .n.red{background:var(--red);color:#fff}
.todo-list .n.amber{background:var(--amber);color:#fff}
.todo-list .n.zero{background:var(--subtle);color:var(--fg-subtle)}
.sched .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border-muted);cursor:pointer;position:relative}
.sched .it:hover{background:var(--inset)}
.sched .it.now{background:#fef2f2}
.sched .it.now::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.sched .tm{font-size:12.5px;font-weight:800;width:96px;flex:0 0 96px}
.sched .tm i{font-style:normal;font-size:10.5px;color:var(--fg-subtle);font-weight:600}
/* calendar */
.calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:var(--subtle);border-radius:var(--r-md);padding:2px}
.seg button{padding:4px 13px;border-radius:6px;font-size:12px;color:var(--fg-muted);font-weight:700}
.seg button.on{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.calwrap{display:flex;gap:12px;align-items:flex-start}
.grid{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff;display:flex}
.gut{width:62px;flex:0 0 62px;background:var(--subtle)}
.gut .gh{height:46px;border-bottom:1px solid var(--border)}
.gut .lb{height:var(--hour);font-size:10.5px;color:var(--fg-subtle);text-align:right;padding-right:7px;transform:translateY(-6px)}
.cols{flex:1;display:flex;min-width:0}
.col{flex:1;min-width:0;border-left:1px solid var(--border);position:relative}
.col.today{background:#fffdf5}
.ch{height:46px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--subtle)}
.ch .w{font-size:10.5px;color:var(--fg-muted);font-weight:700}
.ch .d{font-size:14px;font-weight:800}
.col.today .ch .d{background:var(--accent);color:#fff;width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:12px}
.col.sun .ch .w,.col.sun .ch .d{color:var(--red)}
.cbody{position:relative}
.hl{position:absolute;left:0;right:0;height:1px;background:var(--border-muted)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:6}
.nowline b{position:absolute;left:2px;top:-8px;background:var(--red);color:#fff;font-size:9px;padding:0 4px;border-radius:3px;font-weight:800}
.unav{position:absolute;left:0;right:0;z-index:1;
  background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 4px,#f1f5f9 4px,#f1f5f9 8px)}
.blk{position:absolute;left:3px;right:3px;border-radius:var(--r-sm);padding:4px 6px;z-index:3;cursor:pointer;overflow:hidden;
  border:2px solid transparent;font-size:10.5px;line-height:1.3}
.blk:hover{filter:brightness(1.04);box-shadow:0 3px 10px rgba(16,24,40,.18)}
.blk .bt{font-weight:800;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bs{opacity:.9;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.miss{background:var(--red-subtle);border-color:var(--red);color:var(--red)}
.blk.sched{background:var(--accent);border-color:var(--accent);color:#fff}
.blk.done{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
.blk.pend{background:#fff7ed;border-color:var(--amber);color:var(--amber)}
.blk.cancel{background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 5px,#f1f5f9 5px,#f1f5f9 10px);
  border-color:#cbd5e1;color:#64748b;text-decoration:line-through}
.blk.online{border-style:dashed}
.legend{width:186px;flex:0 0 186px;border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;padding:11px}
.legend .lt{font-size:10.5px;color:var(--fg-subtle);font-weight:700;margin:8px 0 6px}
.legend .li{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.legend .sw{width:26px;height:16px;border-radius:4px;border:2px solid transparent;flex:0 0 26px}
.legend .n1{font-size:11px;font-weight:800}
.legend .n2{font-size:10px;color:var(--fg-subtle)}
/* month */
.mgrid{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);background:var(--subtle)}
.mhead div{padding:7px 0;text-align:center;font-size:11px;font-weight:700;color:var(--fg-muted);border-left:1px solid var(--border)}
.mhead div:first-child{border-left:0;color:var(--red)}
.mrow{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border)}
.mcell{min-height:96px;border-left:1px solid var(--border);padding:5px;cursor:pointer}
.mcell:first-child{border-left:0}
.mcell:hover{background:var(--inset)}
.mcell .dn{font-size:11.5px;font-weight:700;margin-bottom:4px}
.mcell.off .dn{color:#cbd5e1}
.mcell.today .dn{background:var(--accent);color:#fff;width:20px;height:20px;border-radius:999px;display:grid;place-items:center;font-size:11px}
.mev{font-size:9.5px;padding:2px 4px;border-radius:4px;margin-bottom:2px;border:1.5px solid transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.mev.miss{background:var(--red-subtle);border-color:var(--red);color:var(--red)}
.mev.sched{background:var(--accent);border-color:var(--accent);color:#fff}
.mev.done{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
.mev.pend{background:#fff7ed;border-color:var(--amber);color:var(--amber)}
.mev.cancel{background:#eef1f4;border-color:#cbd5e1;color:#64748b;text-decoration:line-through}
.mev.online{border-style:dashed}
.more{font-size:9.5px;color:var(--fg-subtle);font-weight:700}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:520px;max-width:94vw;background:#fff;height:100%;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(15,23,42,.2)}
.dh{padding:15px 18px 0}
.dh .x{position:absolute;right:14px;top:12px;font-size:17px;color:var(--fg-subtle)}
.dtabs{display:flex;gap:14px;padding:0 18px;border-bottom:1px solid var(--border-muted);margin-top:10px}
.dtabs button{padding:9px 0;font-size:12.5px;font-weight:700;color:var(--fg-subtle);border-bottom:2px solid transparent}
.dtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.dtabs button:disabled{color:#cbd5e1;cursor:not-allowed}
.dbody{flex:1;overflow:auto;padding:14px 18px}
.dfoot{padding:12px 18px;border-top:1px solid var(--border-muted);display:flex;gap:8px;align-items:center;background:var(--inset)}
/* modal */
.mscrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--r-xl);width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(15,23,42,.3)}
.modal .mh{padding:18px 20px 10px}
.modal .mb{padding:0 20px 14px;display:flex;flex-direction:column;gap:11px}
.modal .mf{padding:12px 20px 16px;display:flex;gap:8px;background:var(--inset)}
.modal .mf .btn{flex:1;justify-content:center;padding:10px}
/* form */
.fld label{display:block;font-size:11px;color:var(--fg-muted);font-weight:700;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-md);font-size:12.5px;background:#fff}
.fld textarea{min-height:96px;resize:vertical;line-height:1.7}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent-subtle);border-color:var(--accent)}
.fld .bad{border-color:var(--red)!important;background:var(--red-subtle)}
.num{width:20px;height:20px;border-radius:5px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:0 0 20px}
.cnt{font-size:11px;font-weight:800}
.cnt.bad{color:var(--red)}
.cnt.ok{color:var(--green)}
.bookchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.bookchip{padding:5px 10px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-subtle);border-radius:999px;font-size:11px;font-weight:700}
.bookchip.add{border-style:dashed;border-color:var(--border);color:var(--fg-muted);background:#fff}
.rules{background:var(--navy);color:#cbd5e1;border-radius:var(--r-md);padding:11px 12px;font-size:11px}
.rules .r{display:flex;gap:7px;margin-top:6px;align-items:flex-start}
.rules .r b{background:#334155;color:#fff;border-radius:4px;min-width:16px;height:16px;display:grid;place-items:center;font-size:9px;flex:0 0 16px;margin-top:1px}
.rules .good{color:#86efac}.rules .bad2{color:#fca5a5}
.aibox{background:var(--navy);border-radius:var(--r-lg);overflow:hidden}
.aibox .ah{display:flex;align-items:center;gap:10px;padding:12px 14px}
.aibox .ah .t{color:#fff;font-size:12.5px;font-weight:800}
.aibox .ah .s{color:#94a3b8;font-size:10.5px}
.aibox pre{margin:0;padding:12px 14px;background:#0b1220;color:#e2e8f0;font-size:11px;line-height:1.65;
  max-height:230px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;color:var(--fg-muted);text-align:left;padding:8px 10px;background:var(--subtle);font-weight:700;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--border-muted);font-size:12px}
td.num2,th.num2{text-align:right;font-variant-numeric:tabular-nums}
/* misc */
.bars{display:flex;gap:3px}
.bar{width:16px;height:7px;border-radius:2px;background:#e2e8f0}
.bar.on.low{background:#ea580c}.bar.on.mid{background:var(--accent)}.bar.on.high{background:var(--green)}
.pct{border:1.5px solid #bfdbfe;border-radius:var(--r-lg);padding:12px 14px;background:#fff}
.pct .v{font-size:26px;font-weight:800;color:var(--accent);line-height:1}
.pctbar{height:7px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:7px 0 5px}
.pctbar i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 17px;border-radius:999px;font-size:12px;z-index:90;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1}
.stat{border-radius:var(--r-lg);padding:13px 15px;border:1.5px solid var(--border-muted);background:#fff;flex:1;min-width:150px}
.stat .k{font-size:11.5px;font-weight:700;color:var(--fg-muted)}
.stat .v{font-size:23px;font-weight:800;margin:2px 0}
.stat .s{font-size:10.5px;color:var(--fg-subtle)}
.stat.green{border-color:var(--green-line);background:var(--green-subtle)}
.stat.red{border-color:var(--red-line);background:var(--red-subtle)}
.stat.blue{border-color:#bfdbfe;background:var(--accent-subtle)}
.pay{background:var(--navy);border-radius:var(--r-lg);padding:15px;color:#e2e8f0}
.pay .l{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;border-bottom:1px solid #1e293b}
.pay .l b{font-weight:700}
.pay .tot{display:flex;justify-content:space-between;padding:11px 0 3px;font-size:14px;font-weight:800;color:#fff}
.progress{display:flex;gap:4px}
.progress i{width:26px;height:7px;border-radius:999px;background:#e2e8f0}
.progress i.on{background:var(--amber)}

/* ══ 2026-08-21 대표 피드백 ── ① 정책은 화면 맨 위 · ② 차감은 가장 강하게 ══ */
.policy{display:flex;align-items:flex-start;gap:11px;background:var(--navy);color:#cbd5e1;border-radius:var(--r-lg);
  padding:11px 14px;margin-bottom:10px;font-size:11.8px;line-height:1.6}
.policy .tag{background:#facc15;color:#422006;font-weight:900;font-size:9.5px;letter-spacing:.4px;border-radius:6px;
  padding:4px 7px;flex:0 0 auto;margin-top:1px;white-space:nowrap}
.policy b{color:#fff}
.policy .no{color:#fca5a5;font-weight:800}
.policy .yes{color:#86efac;font-weight:800}
.policy .who{margin-left:auto;flex:0 0 auto;text-align:right;color:#64748b;font-size:10.5px;line-height:1.5}

/* ── 직전 급여(7월분)에 포함된 수업 시드 — 전부 승인 완료 ── */
(function seedPrevPayout(){
  // 7월 정규 시간표: 화 SAT · 수 AP · 목 ELA · 금 MAP
  const plan={2:['17:00',120,'SAT Reading & Writing',1,'대면'],
              3:['16:00',120,'AP World History',2,'대면'],
              4:['18:00',120,'ELA Intermediate',3,'비대면'],
              5:['15:00',120,'MAP Reading G8',4,'비대면']};
  const late={'2026-07-14':2.5,'2026-07-24':5};   // 5,000원 · 10,000원 차감 사례 각 1건
  for(let d='2026-07-01'; d<='2026-07-31'; d=addDays(d,1)){
    const p=plan[wdOf(d)]; if(!p) continue;
    const over=late[d]||0.5;                       // 기본은 종료 30분 뒤 제출(정시)
    const at=fromMin(toMin(p[0])+p[1]+Math.round(over*60));
    SESS.push(S(d,p[0],p[1],p[2],p[3],p[4],'approved',{submittedAt:`${d} ${at}`}));
  }
})();

/* 기간 정산 계산 — 히스토리/급여 카드가 같은 함수를 쓴다 */
function settle(period){
  const list=SESS.filter(s=>s.date.startsWith(period)).sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start));
  const held=list.filter(s=>!isCanceled(s)&&isPast(s));
  const done=held.filter(s=>s.report==='approved'||s.report==='submitted');
  const miss=held.filter(s=>s.report==='none'||s.report==='draft');
  const doneH=done.reduce((a,s)=>a+s.dur,0)/60, missH=miss.reduce((a,s)=>a+s.dur,0)/60;
  const gross=doneH*ME.rate;
  const pen=done.reduce((a,s)=>a+latePenalty(s),0);
  const penCnt=done.filter(s=>latePenalty(s)>0).length;
  const tax=Math.round((gross-pen)*0.033);
  const future=list.filter(s=>!isCanceled(s)&&!isPast(s));
  return {period,list,held,done,miss,doneH,missH,gross,pen,penCnt,tax,net:gross-pen-tax,future};
}

const nowTs=()=>new Date(`${TODAY}T${fromMin(NOW_MIN)}:00+09:00`);
function penaltyNow(s){
  const end=new Date(`${s.date}T${endTime(s)}:00+09:00`);
  const h=(nowTs()-end)/3600000;
  if(h<=0) return {amount:0,tone:'ok',  head:'수업이 끝난 뒤 1시간 안에 쓰면 차감이 없습니다', left:null};
  if(h<1)  return {amount:0,tone:'ok',  head:'지금 제출하면 차감이 없습니다',                 left:Math.round((1-h)*60)};
  if(h<4)  return {amount:5000,tone:'warn',head:'지금 제출하면 5,000원이 깎입니다',            left:Math.round((4-h)*60)};
  return     {amount:10000,tone:'bad', head:'지금 제출하면 10,000원이 깎입니다',              left:null};
}

      <div class="h2">${md(wk[0])} – ${md(wk[6])} <span class="chip blue" style="vertical-align:3px">${UI.weekStart===monOf(TODAY)?'이번 주':' '}</span></div>
      <div class="note">수업 ${sum.c}건 · 시수 ${sum.h}시간 · 리포트 미작성 ${sum.m}건 · 취소 ${sum.x}건</div>
    </div>
    <div class="sp"></div>
    <div class="seg"><button class="${UI.calMode==='week'?'on':''}" onclick="UI.calMode='week';render()">주간</button>
      <button class="${UI.calMode==='month'?'on':''}" onclick="UI.calMode='month';render()">월간</button></div>
    <button class="btn sm" onclick="moveWeek(-1)">← 이전 주</button>
    <button class="btn sm pri" onclick="UI.weekStart=monOf(TODAY);render()">이번 주</button>
    <button class="btn sm" onclick="moveWeek(1)">다음 주 →</button>
  </div>
  <div class="row" style="margin-bottom:9px">
    <span class="note">시간 기준</span>
    <select class="btn sm" style="font-weight:600"><option>대한민국 서울 · KST</option><option>캐나다 밴쿠버 · PST</option></select>
    <span class="note mono">2026.08.21 (금) ${fromMin(NOW_MIN)} KST</span>
    <div class="sp"></div><span class="note">내 스케줄에 배정된 학생만 표시됩니다</span>
  </div>`;

  if(UI.calMode==='month') return missBanner()+head+viewMonth();

  const cols=wk.map(d=>{
    const today=d===TODAY;
    const blocks=SESS.filter(s=>s.date===d).map(s=>{
      const top=(toMin(s.start)-H0*60)/60*44, h=Math.max(24,s.dur/60*44-3);
      const st=blockState(s);
      return `<div class="blk ${st} ${s.mode==='비대면'?'online':''}" style="top:${top}px;height:${h}px" onclick="openSession(${s.id})">
        <div class="bt">${s.start} ${esc(s.subject)}</div>
        <div class="bs">${esc(stu(s.studentId).name)} · ${s.mode}</div>
        ${h>60&&st==='miss'?'<div class="bs" style="font-weight:800">리포트 미작성</div>':''}
      </div>`}).join('');
    const un=UNAV.filter(u=>u.date===d).map(u=>{
      const top=(toMin(u.start)-H0*60)/60*44, h=(toMin(u.end)-toMin(u.start))/60*44;
      return `<div class="unav" style="top:${top}px;height:${h}px" title="불가 시간"></div>`}).join('');
    const now=today?`<div class="nowline" style="top:${(NOW_MIN-H0*60)/60*44}px"><b>${fromMin(NOW_MIN)}</b></div>`:'';
    return `<div class="col ${today?'today':''} ${wdOf(d)===0?'sun':''}">
      <div class="ch"><div class="w">${WD[wdOf(d)]}</div><div class="d">${+d.slice(8,10)}</div></div>
      <div class="cbody" style="height:${(H1-H0)*44}px">
        ${Array.from({length:H1-H0},(_,i)=>`<div class="hl" style="top:${(i+1)*44}px"></div>`).join('')}
        ${un}${blocks}${now}
      </div></div>`}).join('');

  return missBanner()+head+`
  <div class="calwrap">
    <div class="grid">
      <div class="gut"><div class="gh"></div>
        ${Array.from({length:H1-H0+1},(_,i)=>`<div class="lb">KST ${String(H0+i).padStart(2,'0')}:00</div>`).join('')}</div>
      <div class="cols">${cols}</div>
    </div>
    ${LEGEND}
  </div>
  <div class="hint" style="margin-top:12px"><b>회색 빗금 배경은 내가 등록한 불가 시간입니다</b>
    관리자는 그 시간에 수업을 넣을 수 없습니다. 수업 블록을 누르면 리포트 작성 · 수업 안내 · 스케줄 변경이 한 창에서 탭으로 열립니다.</div>`;
}
function moveWeek(n){UI.weekStart=addDays(UI.weekStart,7*n);render()}

function viewMonth(){
  const first=UI.month+'-01', firstWd=wdOf(first);
  const start=addDays(first,-firstWd);
  const inMonth=SESS.filter(s=>s.date.startsWith(UI.month));
  const sum={c:inMonth.filter(s=>!isCanceled(s)).length,h:inMonth.filter(s=>!isCanceled(s)).reduce((a,s)=>a+s.dur,0)/60,
             m:inMonth.filter(s=>blockState(s)==='miss').length,x:inMonth.filter(isCanceled).length};
  let rows='';
  for(let w=0;w<5;w++){
    let cells='';
    for(let d=0;d<7;d++){
      const date=addDays(start,w*7+d), off=!date.startsWith(UI.month);
      const list=SESS.filter(s=>s.date===date);
      const show=list.slice(0,3), more=list.length-show.length;
      cells+=`<div class="mcell ${off?'off':''} ${date===TODAY?'today':''}" onclick="UI.calMode='week';UI.weekStart=monOf('${date}');render()">
        <div class="dn">${+date.slice(8,10)}</div>
        ${show.map(s=>`<div class="mev ${blockState(s)} ${s.mode==='비대면'?'online':''}">${s.start} ${esc(s.subject)}</div>`).join('')}
        ${more>0?`<div class="more">+${more}개 더</div>`:''}
      </div>`;
    }
    rows+=`<div class="mrow">${cells}</div>`;
  }
  return `<div class="row" style="margin:-4px 0 8px"><div class="note">2026년 8월 · 수업 ${sum.c}건 · 시수 ${sum.h}시간 · 리포트 미작성 ${sum.m}건 · 취소 ${sum.x}건</div></div>
  <div class="calwrap"><div style="flex:1;min-width:0">
    <div class="mgrid"><div class="mhead">${WD.map(w=>`<div>${w}</div>`).join('')}</div>${rows}</div>
    <div class="hint" style="margin-top:12px"><b>주간과 월간은 같은 색 · 테두리 체계를 씁니다</b>
      두 화면을 따로 배울 필요가 없습니다. 하루에 4건 이상이면 '+N개 더'로 접히고, 날짜를 누르면 그 주 주간 시간표로 넘어갑니다.</div>
  </div>${LEGEND}</div>`;
}
</script>
<script>
/* ══ 수업 드로어 — 리포트 작성 · 수업 안내 · 스케줄 변경 ══ */
function openSession(id){
  const s=sess(id);
  UI.drawer=id;
  UI.dtab = isCanceled(s) ? 'locked' : 'report';
  UI.form={content:s.content||'',progress:s.progress||'',homework:s.homework||'',touched:false};
  UI.chg={date:s.date,start:s.start,end:endTime(s),reason:''};
  render();
}
const ABBR=[/\bSAT\s?RW\b/i,/\bAP\s?World\b(?!\s?History)/i,/\bMAP\s?G8\b/i,/\bVocab\b(?!ulary)/i,/\bELA\s?Int\b/i];
const hasAbbr=t=>ABBR.some(r=>r.test(t));
function contentChecks(t){
  return {len:t.trim().length,
    a:/(교재|Week|Unit|Set|Chapter|Quiz|지문|Drill|Workbook)/i.test(t),
    b:/(정답률|집중|반응|맞|틀|이해|막히|잘 따라|헷갈)/.test(t),
    c:/(다음|남았|복습|숙제|다시|이어서|계속)/.test(t)};
}
function renderLayer(){
  const L=$('layer');
  if(UI.modal){L.innerHTML=modalHtml();return}
  if(UI.drawer==null){L.innerHTML='';return}
  L.innerHTML=`<div class="scrim" onclick="if(event.target===this)back()">${drawerHtml()}</div>`;
  const box=$('contentBox'); if(box){box.focus();box.setSelectionRange(box.value.length,box.value.length)}
}
function drawerHtml(){
  const s=sess(UI.drawer), st=stu(s.studentId), cx=isCanceled(s), d=dDay(s);
  const tabs = cx
    ? `<button class="on">리포트 작성 불가</button><button onclick="setTab('guide')">수업 안내</button><button disabled>스케줄 변경</button>`
    : `<button class="${UI.dtab==='report'?'on':''}" onclick="setTab('report')">리포트 작성</button>
       <button class="${UI.dtab==='guide'?'on':''}" onclick="setTab('guide')">수업 안내</button>
       <button class="${UI.dtab==='change'?'on':''}" onclick="setTab('change')">스케줄 변경 · D-${d}</button>`;
  const body = cx?tabCanceled(s): UI.dtab==='guide'?tabGuide(s): UI.dtab==='change'?tabChange(s): tabReport(s);
  const foot = cx
    ? `<button class="btn" onclick="back()" style="flex:1;justify-content:center">닫기</button>
       <button class="btn go" style="flex:2;justify-content:center" onclick="setTab('guide')">수업 안내 보기</button>`
    : UI.dtab==='change' ? footChange(s)
    : UI.dtab==='guide' ? `<button class="btn" onclick="back()" style="flex:1;justify-content:center">닫기</button>
       <button class="btn pri" style="flex:2;justify-content:center" onclick="setTab('report')">리포트 쓰러 가기</button>`
    : `<button class="btn" onclick="back()" style="flex:1;justify-content:center">닫기</button>
       <button class="btn go" style="flex:2;justify-content:center" onclick="submitReport(${s.id})">승인 요청하기</button>`;
  return `<div class="drawer" onclick="event.stopPropagation()">
    <div class="dh" style="position:relative">
      <button class="x" onclick="back()">✕</button>
      <div class="h2">${esc(s.subject)}</div>
      <div class="note">${mdw(s.date)} ${s.start} – ${endTime(s)} · ${esc(st.name)}</div>
      <div class="row" style="gap:5px;margin-top:7px;flex-wrap:wrap">
        ${cx?'<span class="chip gray">수업 취소</span>':
          s.report==='approved'?'<span class="chip green">승인 완료</span>':
          s.report==='submitted'?'<span class="chip amber">승인 대기</span>':
          isPast(s)?'<span class="chip red">리포트 미작성</span>':'<span class="chip blue">수업 예정</span>'}
        <span class="chip gray">${s.mode} · ${s.mode==='대면'?'학원':'줌'}</span>
        <span class="chip gray">${esc(st.intensity)}</span>
        <span class="chip gray">${esc(st.lang)}</span>
      </div>
    </div>
    <div class="dtabs">${tabs}</div>
    <div class="dbody">${body}</div>
    <div class="dfoot">${foot}</div>
  </div>`;
}
function setTab(t){UI.dtab=t;renderLayer()}

/* ── 취소된 수업 (p.12) ── */
function tabCanceled(s){
  const c=s.canceled;
  return `
  <div style="background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 6px,#e2e8f0 6px,#e2e8f0 12px);
    border:1px solid var(--border);border-radius:var(--r-md);padding:13px;margin-bottom:12px">
    <b>⊘ 이 수업은 취소되었습니다</b>
    <div class="note" style="margin-top:3px">${esc(c.reason)}</div>
  </div>
  <div class="row" style="align-items:stretch;gap:8px;margin-bottom:12px">
    <div class="card pad" style="flex:1"><div class="note">리포트</div><div class="h3" style="color:var(--red)">작성 불가</div>
      <div class="note" style="margin-top:3px">쓰실 필요도 없고, 쓰실 수도 없습니다.</div></div>
    <div class="card pad" style="flex:1"><div class="note">시수</div><div class="h3">0시간 · 제외</div>
      <div class="note" style="margin-top:3px">이 달 시수 합계에 들어가지 않습니다.</div></div>
    <div class="card pad" style="flex:1"><div class="note">정산</div><div class="h3">₩0 · 제외</div>
      <div class="note" style="margin-top:3px">지급액에도, 지각 차감에도 잡히지 않습니다.</div></div>
  </div>
  <div class="h3" style="margin-bottom:6px">취소 처리</div>
  <div class="card pad">
    <div class="row"><b>${esc(c.by)}</b><span class="note">· ${esc(c.at)}</span></div>
    ${c.makeup?`<div class="note" style="margin-top:4px">보강 일정 — <b>${esc(c.makeup)}</b></div>`:''}
    <div class="note" style="margin-top:6px">취소가 잘못되었다면 건의 사항에서 알려 주세요. 강사가 직접 되돌릴 수는 없습니다.</div>
  </div>
  <div class="hint" style="margin-top:12px"><b>지우지 않고 빗금으로 남깁니다</b>
    왜 그날 수업이 없었는지 나중에 확인할 수 있어야 하기 때문입니다.</div>`;
}

/* ── 리포트 작성 (p.20~22) ── */
function tabReport(s){
  const st=stu(s.studentId), f=UI.form, c=contentChecks(f.content);
  const okLen=c.len>=60, all3=c.a&&c.b&&c.c;
  const books=st.books.flatMap(b=>b.items.map(i=>i.n));
  const abbrP=hasAbbr(f.progress), abbrH=hasAbbr(f.homework);
  const grades=['PK','K','G1','G2','G3','G4','G5','G6','G7','G8','G9','G10','G11','G12'];
  const pn=penaltyNow(s);
  return `
  <!-- ② 대표 피드백: 강의료 차감은 리포트 화면에서 가장 먼저, 가장 크게 -->
  <div class="penalty" style="padding:11px 13px;margin-bottom:12px">
    <div style="min-width:0">
      <div class="lead" style="font-size:14.5px">${pn.head}</div>
      <div class="sub">${pn.left!=null?`다음 차감까지 <b style="color:#fff">${pn.left}분</b> 남았습니다. `:''}늦어도 리포트는 반드시 써야 합니다.</div>
    </div>
    <div class="cases">
      <div class="case ${pn.amount?'':'ok'}"><div class="w">지금 제출하면</div>
        <div class="a">${pn.amount?'− '+pn.amount.toLocaleString('ko-KR'):'0원'}</div></div>
      <div class="case"><div class="w">4시간이 지나면</div><div class="a">− 10,000</div></div>
    </div>
  </div>
  <div class="row" style="margin-bottom:9px"><div class="num">1</div><b>학생 · 학년</b></div>
  <div class="row" style="gap:8px;margin-bottom:4px">
    <div class="fld" style="flex:1"><input value="${esc(st.name)}" readonly style="background:var(--inset)"></div>
    <div class="fld" style="flex:1"><select>${grades.map(g=>`<option ${g===st.grade?'selected':''}>${g}</option>`).join('')}</select></div>
  </div>
  <div class="note" style="margin-bottom:13px">학생 이름은 배정된 수업에서 자동으로 들어옵니다.</div>

  <div class="row" style="margin-bottom:9px"><div class="num">2</div><b>날짜 · 시간 · 과목</b></div>
  <div class="row" style="gap:8px;margin-bottom:6px">
    <div class="fld" style="flex:1"><input value="${mdw(s.date)} ${s.start} – ${endTime(s)}" readonly style="background:var(--inset)"></div>
    <button class="btn sm ${canRequestChange(s)?'':'danger'}" onclick="setTab('change')">스케줄 변경 · D-${dDay(s)}</button>
  </div>
  <div class="fld" style="margin-bottom:4px"><input value="${esc(s.subject)}" readonly style="background:var(--inset)"></div>
  <div class="note" style="margin-bottom:13px">날짜와 시간은 스케줄에서 옮겨야 합니다. 겹치는 일정이 있으면 변경할 수 없습니다.</div>

  <div class="row" style="margin-bottom:9px"><div class="num">3</div><b>수업 내용</b><span class="chip red">필수</span></div>
  <div class="fld"><textarea id="contentBox" class="${f.touched&&(!okLen||!all3)?'bad':''}" oninput="UI.form.content=this.value;UI.form.touched=true;renderLayer()"
    placeholder="예) SAT Reading and Writing Week 6 지문 두 편을 풀었습니다. 근거 문장을 묻자 세 번 모두 찾아냈고, 후반 20분에 집중이 떨어졌습니다. 추론 문항 두 개는 다음 시간에 다시 봅니다.">${esc(f.content)}</textarea></div>
  <div class="row" style="margin:5px 0 9px">
    <span class="cnt ${okLen?'ok':'bad'}">${c.len} / 60자</span>
    <span class="note">· 아래 세 가지가 모두 들어가야 합니다</span>
    <div class="sp"></div>
    ${[['무엇을',c.a],['어땠는지',c.b],['남은 것',c.c]].map(([n,ok])=>`<span class="chip ${ok?'green':'gray'}">${ok?'✓':'○'} ${n}</span>`).join('')}
  </div>
  <div class="rules">
    <b style="color:#fff;font-size:11.5px">⚑ AI로 쓰셔도 됩니다. 다만 이 세 가지는 반드시 들어가야 합니다</b>
    <div class="r"><b>1</b><div>무엇을 했는지 — 교재 이름과 범위를 넣어서</div></div>
    <div class="r"><b>2</b><div>학생이 어땠는지 — 눈으로 본 것 하나 이상. 정답률, 집중, 반응</div></div>
    <div class="r"><b>3</b><div>무엇이 남았는지 — 다음 시간에 다시 볼 것</div></div>
    <div style="border-top:1px solid #334155;margin-top:8px;padding-top:7px">
      <div class="bad2">✕ 오늘도 열심히 했습니다. 잘 따라왔습니다.</div>
      <div class="good">○ SAT Reading and Writing Week 6 지문 두 편 완료. 근거 문장 세 번 모두 찾아냄. 추론 문항 두 개는 다음 시간에 다시 봅니다.</div>
    </div>
  </div>

  ${[['4','진도 페이지','progress',f.progress,abbrP],['5','숙제 페이지','homework',f.homework,abbrH]].map(([n,label,key,val,abbr])=>`
  <div class="row" style="margin:14px 0 8px"><div class="num">${n}</div><b>${label}</b>
    <span class="chip red">필수</span><span class="chip gray">교재 Full Name</span></div>
  <div class="bookchips">
    ${books.map(b=>`<button class="bookchip" onclick="pickBook('${key}',${JSON.stringify(b).replace(/"/g,'&quot;')})">+ ${esc(b)}</button>`).join('')}
    <button class="bookchip add" onclick="openModal('book')">+ 새 교재 · 자료 추가</button>
  </div>
  <div class="fld"><input class="${(f.touched&&!val.trim())||abbr?'bad':''}" value="${esc(val)}" oninput="UI.form.${key}=this.value;UI.form.touched=true;renderLayer()"
    placeholder="교재 버튼을 누른 뒤 페이지를 적어 주세요"></div>
  ${abbr?`<div class="note" style="color:var(--red);font-weight:700;margin-top:4px">줄임말이 들어 있습니다 — 교재 이름은 Full Name으로 적어 주세요 (SAT RW ✕ / SAT Reading and Writing Week 6 ○)</div>`
    :`<div class="note" style="margin-top:4px">비워 두실 수 없습니다. 위 교재 버튼을 누르고 페이지를 적어 주세요.</div>`}`).join('')}

  <div class="aibox" style="margin-top:16px">
    <div class="ah"><div style="flex:1"><div class="t">리포트 작성용 AI 프롬프트</div>
      <div class="s">복사해서 AI에 붙여넣으면 초안이 나옵니다</div></div>
      <button class="btn pri sm" onclick="copyPrompt(${s.id})">복사하기</button></div>
    <pre>${esc(aiPrompt(s))}</pre>
  </div>
  <div class="note" style="margin-top:8px">프롬프트에 심어 둔 규칙 — 마크다운 기호 금지 · 직접적인 지적 표현 금지 · 완곡하고 정중한 어조 · 한영 병기 금지 · 교재는 정식 명칭 전체로 · 350~450자 세 문단</div>`;
}
function pickBook(key,name){
  const cur=UI.form[key]||'';
  UI.form[key]= cur.trim()? cur.replace(/\s*$/,'')+' / '+name+' ' : name+' ';
  UI.form.touched=true; renderLayer();
  const el=document.querySelector(`input[oninput*="${key}"]`); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}
function aiPrompt(s){
  const st=stu(s.studentId), f=UI.form;
  return `당신은 국제학교 준비 학원의 담당 강사입니다. 아래 수업 기록을 바탕으로 학부모에게 보낼 수업 리포트를 작성해 주세요.

[수업 정보]
학생: ${st.name} (${st.grade})

function copyPrompt(id){
  const t=aiPrompt(sess(id));
  navigator.clipboard?.writeText(t).catch(()=>{});
  toast('AI 프롬프트를 복사했습니다');
}
function submitReport(id){
  const s=sess(id), f=UI.form, c=contentChecks(f.content);
  UI.form.touched=true;
  if(c.len<60){renderLayer();toast("'수업 내용'을 60자 이상 적어 주세요");return}
  if(!(c.a&&c.b&&c.c)){renderLayer();toast('세 가지(무엇을 · 어땠는지 · 남은 것)가 모두 들어가야 합니다');return}
  if(!f.progress.trim()||!f.homework.trim()){renderLayer();toast('진도 페이지와 숙제 페이지는 필수입니다');return}
  if(hasAbbr(f.progress)||hasAbbr(f.homework)){renderLayer();toast('교재 이름을 Full Name으로 적어 주세요');return}
  s.content=f.content; s.progress=f.progress; s.homework=f.homework;
  s.report='submitted';
  s.submittedAt=`${TODAY} ${fromMin(NOW_MIN)}`;
  const pen=latePenalty(s);
  UI.drawer=null; render();
  toast(pen?`승인 요청했습니다 · 지각 제출로 ${won(pen)} 차감`:'승인 요청했습니다 — 관리자 확인 후 학부모에게 발송됩니다');
}

<script>

/* 충돌 4가지 (p.15) */
function changeConflicts(s){
  const c=UI.chg, out=[];
  const ns=toMin(c.start), ne=toMin(c.end);
  if(ne<=ns) out.push({title:'종료가 시작보다 빠릅니다',body:'끝나는 시간을 시작 이후로 골라 주세요.'});
  if(diffDays(TODAY,c.date)<10)
    out.push({title:'너무 가까운 날짜입니다',
      body:`<div style="margin-top:3px">· 옮길 날짜가 오늘부터 10일 안에 있습니다. <b>${mdw(EARLIEST_CHANGE)} 이후</b>로 골라 주세요.</div>
            <div class="note" style="margin-top:4px">10일 이내로 옮겨야 하는 사정이라면 강사 단톡방으로 알려 주세요.</div>`});
  for(const o of SESS){
    if(o.id===s.id||isCanceled(o)||o.date!==c.date) continue;
    const os=toMin(o.start), oe=endMin(o);
    if(!(ne>os&&oe>ns)) continue;
    out.push({title:'이 시간으로는 옮길 수 없습니다',
      body:`<div style="margin-top:3px">· 내 다른 수업과 겹칩니다 — <b>${o.start}–${endTime(o)} ${esc(o.subject)} · ${esc(stu(o.studentId).name)} 학생</b></div>`});
  }
  if(stu(s.studentId).id===1 && c.date==='2026-09-01' && ns<21*60 && ne>19*60)
    out.push({title:'이 시간으로는 옮길 수 없습니다',
      body:`<div style="margin-top:3px">· ${esc(stu(s.studentId).name)} 학생이 다른 수업 중입니다 — <b>19:00–21:00 AP Calculus AB · 정하윤 강사</b></div>
            <div class="note" style="margin-top:4px">강사 또는 학생 일정이 겹치면 변경할 수 없습니다. 다른 시간을 골라 주세요.</div>`});
  for(const u of UNAV){
    if(u.date!==c.date) continue;
    if(ne>toMin(u.start)&&toMin(u.end)>ns)
      out.push({title:'내가 등록한 불가 시간과 겹칩니다',
        body:`<div style="margin-top:3px">· ${u.start}–${u.end} 불가 시간 — 먼저 불가 시간을 풀어야 옮길 수 있습니다.</div>`});
  }
  return out;
}
function footChange(s){
  if(!canRequestChange(s))
    return `<button class="btn" onclick="back()" style="flex:1;justify-content:center">닫기</button>
            <button class="btn pri" style="flex:2;justify-content:center" onclick="go('feedback')">건의 사항으로 가기</button>`;
  const c=UI.chg, changed=(c.date!==s.date||c.start!==s.start||c.end!==endTime(s));
  const bad=changeConflicts(s).length>0||!changed;
  return `<button class="btn" onclick="back()" style="flex:1;justify-content:center">닫기</button>
    <button class="btn go" style="flex:2;justify-content:center" ${bad?'disabled':''} onclick="requestChange(${s.id})">변경 요청하기</button>`;
}
function requestChange(id){
  const s=sess(id);
  if(changeConflicts(s).length){toast('겹치는 일정이 있어 요청할 수 없습니다');return}
  toast('변경을 요청했습니다 — 관리자가 승인하면 시간표에 그대로 옮겨집니다');
  UI.drawer=null; render();
}

<script>

   · 가능 · 대면    (초록 실선)

    const locked=d<UNAV_OPEN;

      const top=(toMin(s.start)-H0*60)/60*30, h=s.dur/60*30;
      return `<div class="blk" style="top:${top}px;height:${h}px;background:var(--accent-subtle);border:1.5px ${s.mode==='비대면'?'dashed':'solid'} #93b4fc;color:var(--accent);font-size:9px;padding:3px 4px;z-index:3"

        <div class="bt">불가 ${u.start}–${u.end}</div>

        ${locked?'<div style="font-size:8.5px;color:var(--fg-subtle);font-weight:700">마감</div>':''}</div>
      <div class="cbody" style="height:${(H1-H0)*30}px" ${locked?'':`onclick="dragRegister('${d}',event)"`}>
        ${Array.from({length:H1-H0},(_,i)=>`<div class="hl" style="top:${(i+1)*30}px"></div>`).join('')}
        ${bookings}${avails}${items}
      </div></div>`}).join('');
  return `
  <div class="datecard" style="padding:12px 16px;margin-bottom:10px">
    <div style="flex:1"><div class="t1">${md(days[0])} – ${md(days[13])} · 2주</div>
      <div class="t2">입사일 ${HIRE} 기준 ${cycle}번째 2주 회차입니다.</div></div>
    <button class="btn sm" onclick="UI.unavStart=addDays(UI.unavStart,-14);render()">← 이전 2주</button>
    <button class="btn sm pri" onclick="UI.unavStart='2026-08-24';render()">지금 설정 가능한 주</button>
    <button class="btn sm" onclick="UI.unavStart=addDays(UI.unavStart,14);render()">다음 2주 →</button>
  </div>
  <div class="card pad" style="padding:11px 13px;margin-bottom:10px">
    <div class="row" style="align-items:center">
      <b style="font-size:12.5px">무엇으로 표기할까요</b>
      <div class="marks" style="margin-left:10px">
        ${MARKS.map(mk=>`<button class="mk ${mode===mk.key?'on':''}" onclick="UI.markMode='${mk.key}';render()" aria-pressed="${mode===mk.key}">
          <span class="sw" style="border-color:${mk.color};border-style:${mk.dash?'dashed':'solid'};background:${mk.key==='불가'?mk.color:'var(--green-subtle)'}"></span>
          <span>${mk.label}<span class="sub"> · ${mk.hint}</span></span></button>`).join('')}

function removeMark(kind,id){
  if(kind!=='av') return;
  const i=AVAIL.findIndex(a=>a.id===id); if(i<0) return;
  AVAIL.splice(i,1); render(); toast('가능 시간 표기를 지웠습니다');
}
function dragRegister(date,e){
  const box=e.currentTarget, y=e.clientY-box.getBoundingClientRect().top;
  const startMin=Math.floor((8*60+y/30*60)/30)*30;
  const endMinV=Math.min(startMin+180,23*60);
  const mode=UI.markMode;
  if(mode==='불가'){
    // ① 대표 피드백: 이미 정해진 수업 스케줄에는 불가 표시를 못 하게 한다
    const clash=fixedIn(date,startMin,endMinV);
    if(clash.length){
      toast(`확정된 수업이 있어 불가 표시를 할 수 없습니다 — ${clash[0].start} ${clash[0].subject}. 스케줄 변경을 먼저 요청하세요`);
      return;
    }
    UI.modal={type:'unav',date,start:fromMin(startMin),end:fromMin(endMinV),reason:''};
    renderLayer(); return;
  }
  AVAIL.push({id:AV_SEQ++,date,start:fromMin(startMin),end:fromMin(endMinV),mode});
  render(); toast(`가능 시간(${mode})을 표기했습니다 — 관리자가 배치할 때 참고합니다`);
}

            <button class="btn sm" onclick="UI.modal.file='Unit 5 인과관계 정리 프린트.pdf';if(!UI.modal.name)UI.modal.name='AP World History Unit 5 인과관계 정리 프린트';renderLayer()">파일 선택</button></div></div>
        <div class="hint"><b>추가하면 세 곳이 동시에 바뀝니다</b>
          ① 진도 페이지 칸에 전체 이름이 자동 입력됩니다 ② 칩 줄에 새 버튼으로 추가됩니다 ③ 수업 안내 교재 목록에 '부교재 · ${ME.name} 강사' 태그를 달고 올라갑니다</div>
      </div>
      <div class="mf"><button class="btn" onclick="closeModal()">취소</button>
        <button class="btn go" ${ok?'':'disabled'} onclick="saveBook()">추가하기</button></div>`);
  }
  if(m.type==='bookchange'){
    const R=[['교재가 너무 쉬움','blue'],['교재가 너무 어려움','amber'],['교재가 수업에 적합하지 않음','red']];
    return wrap(`
      <div class="mh"><div class="h2">교재 변경 요청</div><div class="note">강사는 난이도와 적합성만 고를 수 있습니다.</div></div>
      <div class="mb">
        ${R.map(([n,c])=>`<button class="card pad row" style="width:100%;text-align:left;${m.reason===n?'border-color:var(--accent);background:var(--accent-subtle)':''}"
          onclick="UI.modal.reason='${n}';renderLayer()"><b style="flex:1;font-size:12.5px">${n}</b><span class="chip ${c}">${c==='blue'?'파랑':c==='amber'?'주황':'빨강'}</span></button>`).join('')}
        <div class="card pad row" style="opacity:.5"><b style="flex:1;font-size:12.5px">교재 완료</b><span class="chip green">관리자만 선택</span></div>
        <div class="hint"><b>'교재 완료'는 강사 선택지에 없습니다</b>
          진도 종료 판단은 관리자 몫입니다. 승인하면 이력으로 내려가고, 반려해도 흔적이 남습니다.</div>
      </div>
      <div class="mf"><button class="btn" onclick="closeModal()">취소</button>
        <button class="btn go" ${m.reason?'':'disabled'} onclick="closeModal();toast('교재 변경을 요청했습니다 — 관리자 확인 후 처리됩니다')">요청하기</button></div>`);
  }
  if(m.type==='note'){
    const s=sess(m.id), st=stu(s.studentId);
    return wrap(`
      <div class="mh"><div class="h2">특이사항 작성</div>
        <div class="note">리포트에 담기 어려운 이야기를 남겨 주세요. 필수는 아닙니다.</div></div>
      <div class="mb">
        <div class="card pad row"><div class="av" style="width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800">${esc(st.name.slice(1))}</div>
          <div><b style="font-size:12.5px">${esc(st.name)} 학생 · ${esc(s.subject)}</b>
            <div class="note">${mdw(s.date)} ${s.start} – ${endTime(s)} · ${s.mode}</div></div></div>
        <div class="fld"><label>이 수업에서 무슨 일이 있었나요</label>
          <textarea oninput="UI.modal.body=this.value" placeholder="예) 오늘 유난히 지쳐 보였습니다. 학교 수행평가가 겹쳤다고 지나가듯 이야기했습니다.">${esc(m.body)}</textarea></div>
        <div class="warnbox"><b>필수는 아닙니다. 다만 이런 일이 있었다면 꼭 남겨 주세요</b>
          <div style="margin-top:5px">· 학생이 유난히 지쳐 보이거나 컨디션이 안 좋았을 때<br>
          · 학생이나 학부모가 지나가듯 한 말 중 학원이 알아야 할 것<br>
          · 리포트에 쓰기에는 조심스러운 이야기<br>
          · 학교, 형제자매, 다른 학원과 관련해 들은 이야기</div></div>
        <div class="hint"><b>여기에 쓰신 내용은 학부모에게 전달되지 않습니다. 관리자만 봅니다.</b>
          이 문장이 없으면 강사가 조심스러운 이야기를 쓰지 않습니다.</div>
      </div>
      <div class="mf"><button class="btn" onclick="closeModal()">취소</button>
        <button class="btn go" onclick="saveNote()">남기기</button></div>`);
  }
  return '';
}
function saveUnav(){
  const m=UI.modal;
  if(m.reason.trim().length<15){toast('사유를 15자 이상 적어 주세요');return}
  if(m.date<UNAV_OPEN){toast('1주 전까지만 등록할 수 있습니다');return}
  // ① 확정된 수업 위에는 불가 표시를 남길 수 없다 (드래그 단계와 저장 단계 모두에서 막는다)
  const clash=fixedIn(m.date,toMin(m.start),toMin(m.end));
  if(clash.length){toast(`확정된 수업이 있어 불가 표시를 할 수 없습니다 — ${clash[0].start} ${clash[0].subject}`);return}
  UNAV.push({id:UN_SEQ++,date:m.date,start:m.start,end:m.end,reason:m.reason.trim()});
  closeModal(); render(); toast('불가 시간을 표기했습니다 — 이 시간에는 수업이 배정되지 않습니다');
}
function saveBook(){
  const m=UI.modal, s=sess(UI.drawer||SESS[0].id), st=stu(s.studentId);
  const grp=st.books.find(b=>b.sub===s.subject)||st.books[0];
  grp.items.push({n:m.name.trim(),sz:'0.4MB',from:'08-21',st:'사용 중',isNew:true});
  if(UI.drawer){UI.form.progress=(UI.form.progress?UI.form.progress.replace(/\s*$/,'')+' / ':'')+m.name.trim()+' ';UI.form.touched=true}
  closeModal(); renderLayer(); toast('추가했습니다 — 진도 칸·칩 줄·수업 안내 교재 목록에 함께 반영되었습니다');
}
function saveNote(){
  const m=UI.modal; sess(m.id).note=m.body.trim()||null;
  closeModal(); render(); toast('특이사항을 남겼습니다 — 관리자만 볼 수 있습니다');
}
render();
</script>
</body>
</html>
